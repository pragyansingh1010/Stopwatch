<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stopwatch</title>



  <style>

    * {

      box-sizing: border-box;

    }



    body {

      margin: 0;

      background: #f5f5f5;

      font-family: Arial, sans-serif;

    }



    .container {

      width: 500px;

      min-height: 300px;

      background: #111;

      margin: 100px auto;

      padding: 50px 60px 30px;

      text-align: center;

      color: white;

      border-radius: 5px;

    }



    #time {

      font-size: 55px;

      font-weight: 300;

      color: #e86d2f;

      margin-bottom: 50px;

    }



    .buttons {

      display: flex;

      justify-content: space-between;

      align-items: center;

    }



    button {

      width: 75px;

      height: 75px;

      border-radius: 50%;

      background: #222;

      color: #ccc;

      border: 2px solid #444;

      cursor: pointer;

      font-size: 14px;

    }



    button:hover {

      background: #333;

    }



    #startBtn {

      border-color: #444;

    }



    #startBtn.stop {

      background: #3a1111;

      border-color: #7d2222;

      color: red;

    }



    #lapBtn.reset {

      color: white;

    }



    #laps {

      margin-top: 20px;

      padding-top: 15px;

      border-top: 1px solid #333;

      text-align: left;

      max-height: 150px;

      overflow-y: auto;

    }



    #laps li {

      list-style: none;

      color: #aaa;

      padding: 6px 0;

      border-bottom: 1px solid #222;

    }

  </style>

</head>



<body>



  <div class="container">



    <label id="time">00:00:00</label>



    <div class="buttons">

      <button id="lapBtn">Lap</button>

      <button id="startBtn">Start</button>

    </div>



    <ul id="laps"></ul>



  </div>







</body>

</html>
