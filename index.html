<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stopwatch</title>



  <style>

    * {

      box-sizing: border-box;

    }



    body {

      margin: 0;

      background: #f5f5f5;

      font-family: Arial, sans-serif;

    }



    .container {

      width: 500px;

      min-height: 300px;

      background: #111;

      margin: 100px auto;

      padding: 50px 60px 30px;

      text-align: center;

      color: white;

      border-radius: 5px;

    }



    #time {

      font-size: 55px;

      font-weight: 300;

      color: #e86d2f;

      margin-bottom: 50px;

    }


  </style>

</head>



<body>



  <div class="container">



    <label id="time">00:00:00</label>



    <div class="buttons">

      <button id="lapBtn">Lap</button>

      <button id="startBtn">Start</button>

    </div>



    <ul id="laps"></ul>



  </div>







</body>

</html>
